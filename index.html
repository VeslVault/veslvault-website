<script>
/*
  One URL for everyone: veslvault.com never shows /desktop/ or /mobile/ in the
  address bar. GitHub Pages is static only (no edge/user-agent routing), so this
  page runs the same phone check as /desktop/ and /mobile/, fetches the right
  page's HTML synchronously, and replaces this document with it before anything
  paints. ?view=desktop / ?view=mobile still override it for testing.

  The tags above are for anything that never runs this script: share-link
  previews (iMessage, Slack, X, Facebook) and search crawlers. For a real
  visitor, document.write() below replaces this whole document (these tags
  included) with the right page, so nothing here is duplicated. Nothing is
  added after this script, so there is nothing left for the parser to carry
  over once document.write() runs — that is what would duplicate it.
*/
(function(){
  var phone = /iPhone|iPod|Android.+Mobile|Windows Phone/i.test(navigator.userAgent)
    || window.matchMedia('(max-width: 760px) and (pointer: coarse)').matches;
  if (/[?&]view=desktop/.test(location.search)) phone = false;
  else if (/[?&]view=mobile/.test(location.search)) phone = true;

  var target = phone ? '/mobile/index.html' : '/desktop/index.html';
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', target, false);
    xhr.send(null);
    if (xhr.status >= 200 && xhr.status < 400 && xhr.responseText) {
      document.open();
      document.write(xhr.responseText);
      document.close();
    } else {
      location.replace(target);
    }
  } catch (e) {
    location.replace(target);
  }
})();
</script>
