<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>VAULT · Account Confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* VAULT two-tone, like the app's Sign In screen (always dark). */
  :root { --ground: #1C1C1E; --surface: #2C2C2E; --text: #FFFFFF; --muted: rgba(235,235,245,0.6); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--text);
    font-family: Inter, -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  /* Same as the app's Sign In header: mark 68, 12 apart, VAULT title bold + tracking 6, callout tagline, 32 to the card. */
  .mark { width: 68px; height: 68px; display: block; margin: 0 auto; }
  .wordmark { font-weight: 700; font-size: 28px; line-height: 34px; letter-spacing: 6px; margin: 12px 0 0 6px; }
  .tag { color: var(--muted); font-size: 16px; line-height: 21px; margin-top: 12px; }
  .card { background: var(--surface); border-radius: 20px; padding: 28px 24px; margin-top: 32px; }
  .tick {
    width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 16px;
    display: grid; place-items: center; background: rgba(48,164,108,0.18); color: #30A46C;
  }
  h1 { font-size: 22px; font-weight: 600; }
  p.line { color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 8px; }
  a.button {
    display: block; margin-top: 24px; padding: 16px; border-radius: 999px;
    background: var(--text); color: #000; text-decoration: none;
    font-weight: 600; font-size: 17px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  a.button:active { transform: scale(0.98); opacity: 0.85; }
  .note { color: var(--muted); font-size: 13px; margin-top: 16px; line-height: 1.45; }
  @media (prefers-reduced-motion: reduce) { a.button { transition: none; } }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M12.3,17 L46,17 L46,87.6 L50,96 Z" fill="#FAFAF8"/><path d="M87.7,17 L54,17 L54,87.6 L50,96 Z" fill="#FAFAF8"/></svg>
  <div class="wordmark">VAULT</div>
  <div class="tag">Vessel Management for Superyachts</div>

  <section class="card" aria-live="polite">
    <div class="tick" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1>You're Confirmed</h1>
    <p class="line">Open the app and sign in.</p>
    <a class="button" href="veslvault://open">Continue to VAULT</a>
  </section>
</main>
</body>
</html>
