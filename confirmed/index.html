<style>
  /* VAULT two-tone, like the app's Sign In screen (always dark). */
  :root { --ground: #000000; --surface: #1C1C1E; --text: #FFFFFF; --muted: rgba(235,235,245,0.6); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--text);
    font-family: Inter, -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  .mark { width: 96px; height: 96px; display: block; margin: 0 auto 20px; }
  .wordmark { font-weight: 700; font-size: 28px; letter-spacing: 0.21em; margin-left: 0.21em; }
  .tag { color: var(--muted); font-size: 15px; margin-top: 8px; }
  .card { background: var(--surface); border-radius: 20px; padding: 28px 24px; margin-top: 40px; }
  .tick {
    width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 16px;
    display: grid; place-items: center; background: rgba(48,164,108,0.18); color: #30A46C;
  }
  h1 { font-size: 22px; font-weight: 600; }
  p.line { color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 8px; }
  a.button {
    display: block; margin-top: 24px; padding: 16px; border-radius: 999px;
    background: var(--text); color: #000; text-decoration: none;
    font-weight: 600; font-size: 17px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  a.button:active { transform: scale(0.98); opacity: 0.85; }
  .note { color: var(--muted); font-size: 13px; margin-top: 16px; line-height: 1.45; }
  @media (prefers-reduced-motion: reduce) { a.button { transition: none; } }
</style>
</head>
